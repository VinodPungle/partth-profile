<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page not found · Parth Pungle</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <style>
    :root {
      --bg: #f7f3ea; --ink: #1c170f; --muted: #6b6353; --accent: #b4451f;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14110b; --ink: #ede5d4; --muted: #a39a86; --accent: #ff8a5c; }
    }
    * { margin: 0; box-sizing: border-box; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: var(--bg); color: var(--ink);
      min-height: 100vh; display: grid; place-items: center; padding: 2rem;
    }
    main { max-width: 34rem; }
    p.code { font-size: 0.9rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 1rem; }
    h1 { font-size: clamp(2rem, 6vw, 3.25rem); line-height: 1.1; margin-bottom: 1rem; }
    p.note { color: var(--muted); line-height: 1.6; margin-bottom: 2rem; font-family: 'Helvetica Neue', Arial, sans-serif; }
    a.home {
      display: inline-block; font-family: 'Helvetica Neue', Arial, sans-serif;
      background: var(--ink); color: var(--bg); text-decoration: none;
      padding: 0.8rem 1.6rem; border-radius: 999px; font-size: 0.95rem;
    }
    a.home:hover, a.home:focus-visible { background: var(--accent); color: #fff; }
    a.home:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>This page doesn't exist.</h1>
    <p class="note">The address may be mistyped, or the page has moved. Everything on this site lives on a single page.</p>
    <a class="home" href="/">Back to the portfolio</a>
  </main>
</body>
</html>
